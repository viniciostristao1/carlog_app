name: Build APK teste (PR23 — TEMPORÁRIO, remover antes do merge)

# TEMPORÁRIO: gera APK de teste da branch do PR #23, sem publicar em release
# nenhum (o asset vai como artefato do run). REMOVER este arquivo antes de
# qualquer merge no main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Assinatura (keystore dos secrets, igual à oficial)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build APK (release, por ABI)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Renomeia p/ teste
        run: >
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          carlog-pr23-teste.apk

      - name: Anexa APK de teste (artefato, sem release)
        uses: actions/upload-artifact@v4
        with:
          name: carlog-pr23-teste
          path: carlog-pr23-teste.apk
