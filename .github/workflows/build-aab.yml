name: Build AAB (Play Store)

# Gera SÓ o AAB (Android App Bundle) assinado, para subir na Play Store.
# É um job separado do build-apk (que faz só o APK) DE PROPÓSITO: compilar APK+AAB
# no mesmo job estourava tempo/memória no runner grátis (OOM). Aqui é uma compilação
# só → cabe. Roda apenas sob demanda (workflow_dispatch) — não a cada push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Firebase (só se houver secret; senão usa o versionado)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            echo "$FIREBASE_OPTIONS_DART" | base64 -d > app/lib/firebase_options.dart
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/android/app/google-services.json
          fi

      - name: Assinatura de release (keystore de upload dos secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERRO: sem KEYSTORE_BASE64 nos secrets — a Play Store exige AAB assinado com a chave de upload." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/upload-keystore.jks
          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF
          echo "Keystore de upload aplicada."

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: Build AAB (release, para a Play Store)
        working-directory: app
        run: flutter build appbundle --release

      - name: Publica o AAB no release ci-latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI build (rolling)
          prerelease: true
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
